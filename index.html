<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈国消息 · 多人大厅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c0e2b 0%, #1a1a4e 40%, #2d1b69 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 星空背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 20% 70%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 40% 85%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 15% 45%, rgba(255,255,255,0.4), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        /* 通用卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .card .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .input-group input:focus {
            border-color: rgba(139, 92, 246, 0.6);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show { opacity: 1; }

        /* ===== 聊天界面 ===== */
        #chatScreen {
            display: none;
            flex-direction: column;
            height: 85vh;
            max-height: 820px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }

        /* 顶部栏 */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
        }

        .chat-header .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 800;
            font-size: 21px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #b185ff 0%, #e056ff 55%, #ff5b9c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(177, 133, 255, .35);
            line-height: 1.2;
            user-select: none;
        }

        .room-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .room-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 11px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .5px;
            color: #fff;
            background: linear-gradient(135deg, #7c4dff, #e040fb);
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(124, 77, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .35);
            position: relative;
            top: 1px;
        }

        .room-tag::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #69ff9d;
            box-shadow: 0 0 8px #69ff9d;
            animation: roomPulse 1.8s ease-in-out infinite;
        }

        @keyframes roomPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .45; transform: scale(.75); }
        }

        .room-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, .5);
            margin-left: 4px;
            letter-spacing: .3px;
        }

        .chat-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            font-weight: 700;
        }

        .chat-header .room-info h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header .room-info .status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px #34d399;
        }

        .online-count {
            color: rgba(255,255,255,0.45);
            font-size: 12px;
        }

        .chat-header .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .logout-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chat-header .logout-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.4);
            color: #fca5a5;
        }

        /* 主体：消息区 + 侧栏 */
        .chat-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 消息列表 */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.own {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        /* 他人头像+昵称行 */
        .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .msg-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            font-weight: 700;
            flex-shrink: 0;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-meta .author {
            color: rgba(255, 255, 255, 0.65);
            font-size: 12px;
            font-weight: 600;
        }

        .msg-meta .time {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }

        .msg-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.own .msg-bubble {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.other .msg-bubble {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            border-bottom-left-radius: 6px;
        }

        /* 系统通知 */
        .sys-msg {
            align-self: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            animation: msgIn 0.3s ease;
        }

        /* 在线用户侧栏 */
        .sidebar {
            width: 180px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 16px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.03);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 2px;
        }

        .sidebar-title {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            padding: 0 4px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 12px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .user-item:hover {
            background: rgba(255,255,255,0.06);
        }

        .user-item .u-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-item .u-name {
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .user-item .u-name.me {
            color: #a855f7;
            font-weight: 600;
        }

        .user-item .u-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 4px #34d399;
            flex-shrink: 0;
        }

        /* 输入区域 */
        .input-area {
            padding: 20px 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-area input:focus {
            border-color: rgba(139, 92, 246, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-area .send-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .input-area .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .input-area .send-btn:active { transform: translateY(0); }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        /* 阶段切换 */
        .screen { display: none; }
        .screen.active { display: block; }
        #chatScreen.active { display: flex; }

        /* 提示条 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(139, 92, 246, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Logo 样式 ===== */
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 28px;
            user-select: none;
            position: relative;
            /* 外围柔和光晕 */
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.35));
        }

        /* 字符方块 */
        .logo .logo-char {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            border-radius: 16px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            box-shadow:
                0 6px 20px rgba(139, 92, 246, 0.4),
                inset 0 0 0 1px rgba(255, 255, 255, 0.18);
            position: relative;
            letter-spacing: 0;
            line-height: 1;
            /* 逐字入场动画 */
            opacity: 0;
            animation: logoIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .logo .logo-char:nth-child(1) { background: linear-gradient(135deg, #7c3aed, #6d28d9); animation-delay: 0.05s; }
        .logo .logo-char:nth-child(2) { background: linear-gradient(135deg, #8b5cf6, #7c3aed); animation-delay: 0.15s; }
        .logo .logo-char:nth-child(3) { background: linear-gradient(135deg, #c026d3, #a21caf); animation-delay: 0.25s; }
        .logo .logo-char:nth-child(4) { background: linear-gradient(135deg, #db2777, #be185d); animation-delay: 0.35s; }

        /* 顶部玻璃高光 */
        .logo .logo-char::after {
            content: '';
            position: absolute;
            top: 5px; left: 7px; right: 7px;
            height: 14px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0));
            pointer-events: none;
        }

        /* 底部细高光边，增强立体 */
        .logo .logo-char::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 40%;
            border-radius: 0 0 16px 16px;
            background: linear-gradient(0deg, rgba(0,0,0,0.18), transparent);
            pointer-events: none;
        }

        /* 入场：上移 + 缩放 + 淡入 */
        @keyframes logoIn {
            0%   { opacity: 0; transform: translateY(-18px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 悬浮微动效：整体缓慢上下浮动 */
        .logo {
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        /* 大 logo 背后的脉冲光晕环 */
        .logo::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 140%;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(168, 85, 247, 0.18), transparent 70%);
            z-index: -1;
            animation: logoGlow 3s ease-in-out infinite;
            pointer-events: none;
            border-radius: 50%;
        }
        @keyframes logoGlow {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
        }

        /* 单个字符 hover 弹出 */
        .logo .logo-char {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        }
        .logo .logo-char:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow:
                0 12px 28px rgba(139, 92, 246, 0.55),
                inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* 聊天界面顶部的小型 logo */
        .logo-sm {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-right: 12px;
            filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.3));
        }

        .logo-sm .logo-char {
            width: 30px;
            height: 30px;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
            opacity: 1;
            animation: none;
        }

        .logo-sm .logo-char::after {
            top: 2px; left: 4px; right: 4px;
            height: 7px;
            border-radius: 6px;
        }
        .logo-sm .logo-char::before {
            border-radius: 0 0 8px 8px;
        }

        /* 头部 logo 小幅浮动 */
        .logo-sm {
            animation: logoFloat 4s ease-in-out infinite;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .card { padding: 32px 24px; }
            .card h1 { font-size: 22px; }
            .logo .logo-char { width: 44px; height: 44px; font-size: 21px; border-radius: 12px; }
            #chatScreen { height: 90vh; border-radius: 18px; }
            .chat-header { padding: 14px 16px; }
            .sidebar { display: none; }
            .messages-area { padding: 16px 18px; }
            .input-area { padding: 16px 18px; }
            .message { max-width: 85%; }
            .input-area .send-btn { padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ① 密码输入界面 -->
        <div id="passwordScreen" class="screen active">
            <div class="card">
                <div class="logo">
                    <span class="logo-char">陈</span>
                    <span class="logo-char">国</span>
                    <span class="logo-char">消</span>
                    <span class="logo-char">息</span>
                </div>
                <h1>🔐 访问验证</h1>
                <p class="subtitle">请输入密码以进入聊天大厅</p>
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="请输入密码…" autocomplete="off">
                </div>
                <button class="btn" onclick="checkPassword()">进入大厅</button>
                <p class="error-msg" id="passwordError"></p>
            </div>
        </div>

        <!-- ② 昵称输入界面 -->
        <div id="nicknameScreen" class="screen">
            <div class="card">
                <div class="logo">
                    <span class="logo-char">陈</span>
                    <span class="logo-char">国</span>
                    <span class="logo-char">消</span>
                    <span class="logo-char">息</span>
                </div>
                <h1>👤 设置昵称</h1>
                <p class="subtitle">请为自己设置一个聊天昵称（其他成员将看到此名称）</p>
                <div class="input-group">
                    <input type="text" id="nicknameInput" placeholder="请输入你的昵称…" autocomplete="off" maxlength="20">
                </div>
                <button class="btn" onclick="setNickname()">加入大厅</button>
                <p class="error-msg" id="nicknameError"></p>
            </div>
        </div>

        <!-- ③ 多人大厅聊天界面 -->
        <div id="chatScreen" class="screen">
            <div class="chat-header">
                <div class="title-area">
                    <div class="logo-sm">
                        <span class="logo-char">陈</span>
                        <span class="logo-char">国</span>
                        <span class="logo-char">消</span>
                        <span class="logo-char">息</span>
                    </div>
                    <div class="avatar" id="headerAvatar">?</div>
                    <div class="room-info">
                        <div class="room-title-row">
                            <span class="brand-logo">陈国消息</span>
                            <span class="room-tag">官方聊天室</span>
                        </div>
                        <div class="status">
                            <span class="status-dot"></span>
                            <span class="online-count" id="onlineCount">0 人在线</span>
                            <span class="room-desc">所有人都在这里 · 进入即加入</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="logout-btn" onclick="logout()">退出</button>
                </div>
            </div>

            <div class="chat-body">
                <div class="messages-area" id="messagesArea">
                    <div class="empty-state" id="emptyState">
                        <div class="icon">💬</div>
                        <p>还没有消息，发送第一条消息吧！</p>
                    </div>
                </div>

                <div class="sidebar" id="sidebar">
                    <div class="sidebar-title">在线成员</div>
                    <div id="userList"></div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息，Enter 发送…" autocomplete="off" maxlength="500">
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function () {
        'use strict';

        // ========== 配置 ==========
        const CORRECT_PASSWORD = 'leapadbackroom194341';
        const ROOM_ID        = 'leapad_room_001';   // 同一个 room 的人共享消息
        const CHANNEL_NAME   = 'leapad_chat_channel';

        const MSG_KEY      = `chat_msgs_${ROOM_ID}`;
        const USERS_KEY    = `chat_users_${ROOM_ID}`;
        const NICKNAME_KEY = 'chat_nickname_v1';

        // 唯一的官方聊天室：所有人进入都自动加入这一间
        const ROOM = 'official';

        const HEARTBEAT_MS = 3000;
        const TIMEOUT_MS   = 10000;

        // ========== 状态 ==========
        let currentUser = '';
        let myColor     = '';
        let messages    = [];
        let users       = {};   // userId -> { name, color, lastSeen }
        let channel     = null;
        let heartbeatTimer = null;
        let myUserId    = generateId();

        // ========== 工具 ==========
        function generateId() {
            return 'u_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }

        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }

        function formatTime(iso) {
            const d = new Date(iso);
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        // 为每个用户生成稳定颜色
        function colorForName(name) {
            const palette = [
                ['#f59e0b', '#d97706'], ['#10b981', '#059669'],
                ['#3b82f6', '#2563eb'], ['#ec4899', '#db2777'],
                ['#06b6d4', '#0891b2'], ['#f97316', '#ea580c'],
                ['#8b5cf6', '#7c3aed'], ['#e11d48', '#be123c'],
                ['#84cc16', '#65a30d'], ['#0ea5e9', '#0284c7'],
                ['#a855f7', '#9333ea'], ['#14b8a6', '#0d9488']
            ];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
            }
            return palette[hash % palette.length];
        }

        // ========== 存储 ==========
        function loadMessages() {
            try {
                messages = JSON.parse(localStorage.getItem(MSG_KEY)) || [];
            } catch (e) { messages = []; }
        }

        function saveMessages() {
            localStorage.setItem(MSG_KEY, JSON.stringify(messages));
        }

        function loadUsers() {
            try {
                users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            } catch (e) { users = {}; }
        }

        function saveUsers() {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        // ========== 界面切换 ==========
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showError(id, text) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ========== 密码验证 ==========
        window.checkPassword = function () {
            const input = document.getElementById('passwordInput').value.trim();
            if (!input) { showError('passwordError', '⚠️ 请输入密码'); return; }
            if (input !== CORRECT_PASSWORD) {
                showError('passwordError', '❌ 密码错误，请重试');
                document.getElementById('passwordInput').value = '';
                return;
            }
            showScreen('nicknameScreen');
            const nickInput = document.getElementById('nicknameInput');
            const saved = localStorage.getItem(NICKNAME_KEY);
            if (saved) nickInput.value = saved;
            nickInput.focus();
        };

        // ========== 昵称设置 ==========
        window.setNickname = function () {
            const input = document.getElementById('nicknameInput').value.trim();
            if (!input) { showError('nicknameError', '⚠️ 请输入昵称'); return; }

            currentUser = input;
            localStorage.setItem(NICKNAME_KEY, currentUser);
            myColor = colorForName(currentUser)[0];
            document.getElementById('headerAvatar').textContent = getInitial(currentUser);

            // 加载数据
            loadMessages();
            loadUsers();

            // 注册自己为在线
            registerSelf();

            // 建立广播频道
            setupChannel();

            // 启动心跳
            startHeartbeat();

            showScreen('chatScreen');
            document.getElementById('messageInput').focus();

            renderMessages();
            renderUserList();
        };

        // ========== 在线用户管理 ==========
        function registerSelf() {
            users[myUserId] = {
                name: currentUser,
                color: myColor,
                lastSeen: Date.now()
            };
            saveUsers();
            broadcast({ type: 'join', userId: myUserId, name: currentUser, color: myColor });
            addSystemMessage(`${currentUser} 加入了大厅`);
        }

        function registerUser(userId, name, color) {
            if (userId === myUserId) return;
            if (!users[userId]) {
                users[userId] = { name, color, lastSeen: Date.now() };
                saveUsers();
                renderUserList();
                addSystemMessage(`${name} 加入了大厅`);
                showToast(`${name} 加入了大厅`);
            } else {
                users[userId].lastSeen = Date.now();
                if (users[userId].name !== name) {
                    users[userId].name = name;
                    users[userId].color = color;
                    saveUsers();
                    renderUserList();
                } else {
                    saveUsers();
                }
            }
        }

        function removeUser(userId) {
            const u = users[userId];
            if (u && userId !== myUserId) {
                delete users[userId];
                saveUsers();
                renderUserList();
                addSystemMessage(`${u.name} 离开了大厅`);
                showToast(`${u.name} 离开了大厅`);
            }
        }

        function cleanupUsers() {
            const now = Date.now();
            let changed = false;
            Object.keys(users).forEach(id => {
                if (id !== myUserId && now - users[id].lastSeen > TIMEOUT_MS) {
                    const u = users[id];
                    delete users[id];
                    changed = true;
                    addSystemMessage(`${u.name} 超时离线`);
                }
            });
            if (changed) {
                saveUsers();
                renderUserList();
            }
        }

        // ========== 广播通信 ==========
        function setupChannel() {
            if (typeof BroadcastChannel !== 'undefined') {
                channel = new BroadcastChannel(CHANNEL_NAME);
                channel.onmessage = function (e) {
                    handleBroadcast(e.data);
                };
            }
            // 监听 storage 事件（跨标签页同步兜底）
            window.addEventListener('storage', function (e) {
                if (e.key === MSG_KEY) {
                    loadMessages();
                    renderMessages();
                }
                if (e.key === USERS_KEY) {
                    loadUsers();
                    renderUserList();
                }
            });
        }

        function broadcast(payload) {
            // 所有消息自动归入唯一的官方聊天室
            payload.room = ROOM;
            // 先写 localStorage 保证同 origin 各标签页可见
            if (payload.type === 'message') {
                saveMessages();
            }
            if (payload.type === 'join' || payload.type === 'heartbeat' || payload.type === 'leave') {
                saveUsers();
            }
            // 再通过 BroadcastChannel 即时通知
            if (channel) {
                channel.postMessage(payload);
            }
        }

        function handleBroadcast(data) {
            if (!data) return;
            // 只接收官方聊天室的消息（唯一房间隔离，未来可扩展多房间）
            if (data.room !== ROOM) return;

            switch (data.type) {
                case 'message':
                    loadMessages();
                    renderMessages();
                    break;

                case 'join':
                    registerUser(data.userId, data.name, data.color);
                    break;

                case 'heartbeat':
                    if (data.userId !== myUserId) {
                        registerUser(data.userId, data.name, data.color);
                    }
                    break;

                case 'leave':
                    removeUser(data.userId);
                    break;
            }
        }

        function startHeartbeat() {
            clearInterval(heartbeatTimer);
            heartbeatTimer = setInterval(function () {
                // 更新自己的 lastSeen
                if (users[myUserId]) {
                    users[myUserId].lastSeen = Date.now();
                    saveUsers();
                }
                broadcast({
                    type: 'heartbeat',
                    userId: myUserId,
                    name: currentUser,
                    color: myColor
                });
                cleanupUsers();
            }, HEARTBEAT_MS);
        }

        // ========== 系统消息 ==========
        function addSystemMessage(text) {
            const msg = {
                id: Date.now() + '_sys_' + Math.random().toString(36).slice(2, 6),
                type: 'system',
                text: text,
                time: new Date().toISOString()
            };
            messages.push(msg);
            saveMessages();
            renderMessages();
        }

        // ========== 发送消息 ==========
        window.sendMessage = function () {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const msg = {
                id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type: 'chat',
                author: currentUser,
                color: myColor,
                text: text,
                time: new Date().toISOString()
            };

            messages.push(msg);
            saveMessages();
            renderMessages();

            // 广播给其他标签页
            broadcast({ type: 'message', msg: msg });

            input.value = '';
            input.focus();
        };

        // ========== 渲染 ==========
        function renderMessages() {
            const area = document.getElementById('messagesArea');
            const emptyState = document.getElementById('emptyState');

            if (messages.length === 0) {
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
            }

            // 移除旧的消息/系统节点
            area.querySelectorAll('.message, .sys-msg').forEach(el => el.remove());

            messages.forEach(msg => {
                if (msg.type === 'system') {
                    const div = document.createElement('div');
                    div.className = 'sys-msg';
                    div.textContent = `[${formatTime(new Date(msg.time))}] ${msg.text}`;
                    area.appendChild(div);
                } else {
                    const isOwn = msg.author === currentUser;
                    const div = document.createElement('div');
                    div.className = `message ${isOwn ? 'own' : 'other'}`;

                    const time = formatTime(new Date(msg.time));

                    if (isOwn) {
                        div.innerHTML = `
                            <div class="msg-meta" style="flex-direction:row-reverse">
                                <span class="author">${escapeHtml(msg.author)}</span>
                                <span class="time">${time}</span>
                            </div>
                            <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                        `;
                    } else {
                        const colors = colorForName(msg.author);
                        div.innerHTML = `
                            <div class="msg-header">
                                <div class="msg-avatar" style="background:linear-gradient(135deg,${colors[0]},${colors[1]})">
                                    ${getInitial(msg.author)}
                                </div>
                                <div class="msg-meta">
                                    <span class="author">${escapeHtml(msg.author)}</span>
                                    <span class="time">${time}</span>
                                </div>
                            </div>
                            <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                        `;
                    }
                    area.appendChild(div);
                }
            });

            scrollToBottom();
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            const countEl = document.getElementById('onlineCount');
            list.innerHTML = '';

            const entries = Object.entries(users);
            const online = entries.filter(([id, u]) =>
                id === myUserId || Date.now() - u.lastSeen <= TIMEOUT_MS
            );

            countEl.textContent = `${online.length} 人在线`;

            // 自己排第一
            online.sort((a, b) => {
                if (a[0] === myUserId) return -1;
                if (b[0] === myUserId) return 1;
                return a[1].name.localeCompare(b[1].name, 'zh');
            });

            online.forEach(([id, u]) => {
                const colors = colorForName(u.name);
                const item = document.createElement('div');
                item.className = 'user-item';
                const isMe = id === myUserId;
                item.innerHTML = `
                    <div class="u-avatar" style="background:linear-gradient(135deg,${colors[0]},${colors[1]})">
                        ${getInitial(u.name)}
                    </div>
                    <span class="u-name ${isMe ? 'me' : ''}">${escapeHtml(u.name)}${isMe ? ' (我)' : ''}</span>
                    <span class="u-dot"></span>
                `;
                list.appendChild(item);
            });
        }

        function scrollToBottom() {
            const area = document.getElementById('messagesArea');
            requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
        }

        // ========== 退出 ==========
        window.logout = function () {
            // 通知他人
            broadcast({ type: 'leave', userId: myUserId, name: currentUser });
            if (users[myUserId]) {
                delete users[myUserId];
                saveUsers();
            }
            clearInterval(heartbeatTimer);
            if (channel) { channel.close(); channel = null; }

            currentUser = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('nicknameInput').value = '';
            document.getElementById('messageInput').value = '';
            showScreen('passwordScreen');
            document.getElementById('passwordInput').focus();
        };

        // ========== 键盘事件 ==========
        document.getElementById('passwordInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') window.checkPassword();
        });

        document.getElementById('nicknameInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') window.setNickname();
        });

        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') window.sendMessage();
        });

        // ========== 页面加载 & 卸载 ==========
        window.addEventListener('load', function () {
            document.getElementById('passwordInput').focus();
        });

        window.addEventListener('beforeunload', function () {
            if (currentUser) {
                broadcast({ type: 'leave', userId: myUserId, name: currentUser });
            }
        });
    })();
    </script>
</body>
</html>
